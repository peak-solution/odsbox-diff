# odsbox-diff configuration — basic authentication example
# Copy this file and adjust values for your environment.
#
# Usage (single server):
#   uv run odsbox-diff --config config.example.toml -entity TestStep -id1 2 -id2 3
#
# Usage (compare across two named servers):
#   uv run odsbox-diff --config config.example.toml -entity TestStep -id1 production:2 -id2 staging:3

# ── Single server ────────────────────────────────────────────────────
# Use [servers.default] when comparing two instances on the same server.
# No need to specify the server name in id declarations, e.g. -id1 2 -id2 3.
[servers.default]
url = "http://localhost:57481/api"
verify_certificate = false          # set true for production with valid TLS
method = "basic"
username = "admin"
# password = "admin"               # prefer keyring over plaintext!
# To store in keyring:
#   keyring set odsbox-diff http://localhost:57481/api:admin

# ── Multiple named servers ───────────────────────────────────────────
# Use [servers.<name>] to define two or more servers.
# Pick them at runtime as prefix in the id declarations, e.g. -id1 production:2 -id2 staging:3.
#
# [servers.production]
# url = "https://prod.example.com/api"
# verify_certificate = true
# method = "m2m"
# client_id = "f0a8cec0-e980-48c4-9898-8a11f40da518"
# token_endpoint = "https://auth.example.com/realms/myrealm/protocol/openid-connect/token"
# scope = ["machine2machine"]
# # client_secret is intentionally omitted — it will be retrieved from keyring.
# # To store in keyring:
# #   keyring set odsbox-diff https://auth.example.com/realms/myrealm/protocol/openid-connect/token:f0a8cec0-e980-48c4-9898-8a11f40da518
#
# [servers.staging]
# url = "https://staging.example.com/api"
# verify_certificate = false
# method = "oidc"
# client_id = "14df520f-f6b0-4135-be1b-bff3f5cc474c"
# redirect_uri = "http://127.0.0.1:1234"
# redirect_url_allow_insecure = true    # needed for localhost redirect
# scope = ["openid", "profile"]
# login_timeout = 60
# webfinger_path_prefix = "/ods"        # optional, for non-standard WebFinger paths
# # authorization_endpoint and token_endpoint are auto-discovered via WebFinger
# # unless explicitly set here:
# # authorization_endpoint = "https://auth.example.com/authorize"
# # token_endpoint = "https://auth.example.com/token"
# # client_secret is optional for OIDC; if needed, store it in keyring:
# #   keyring set https://auth.example.com/token:14df520f-f6b0-4135-be1b-bff3f5cc474c


# ── Diff defaults ────────────────────────────────────────────────────
# These replace the DIFF_OPTIONS formerly hard-coded in the batch file.
# CLI flags (e.g. -erp, -bpb) extend / override these values.
[defaults]
bulk_progress_bar = false
no_bulk = false
dump_dictionaries = false
result_file = "diff_ods_tests_result.json"
verbose = false

exclude_regex_paths = [
    "\\.pdf'\\]\\['TestStepFile\\.(FileChecksum|Size)'\\]$",
    "\\['TestStep.GUID'\\]$",
    "\\['TestStepFile\\.(Location|DateModified)'\\]$",
    "\\['ResultParameter'\\]\\['(Source|Raw)TestStepGUID'\\]\\['ResultParameter\\.Value'\\]$",
]
exclude_paths = []
# Entity names whose relation IDs are resolved to human-readable names in the diff output.
cached_related = ["AoUnit", "AoQuantity"]

[queries.first]
condition= """{
    "name": "My first test step",
    "parent_test.name": "My Test",
    "parent_test.parent_test.name": "My Sub Project",
    "parent_test.parent_test.parent_test.name": "My Project"
}"""
[queries.second]
condition= """{
    "name": "My second test step",
    "parent_test.name": "My Test",
    "parent_test.parent_test.name": "My Sub Project",
    "parent_test.parent_test.parent_test.name": "My Project"
}"""